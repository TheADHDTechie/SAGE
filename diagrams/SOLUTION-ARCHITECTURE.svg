<svg class="architecture-svg large-format-architecture" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1500" role="img" aria-labelledby="title description">
  <title id="title">SAGE WhatsApp multimodal support architecture</title>
  <desc id="description">End-to-end architecture for WhatsApp text, voice, topic shortcuts and interactive preferences through SAGE, Azure Speech transcription and synthesis, GPT-5.6 Luna, local manual and SQLite state, Meta media upload, and human handoff.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3fff8"/>
      <stop offset=".52" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#edf2ff"/>
    </linearGradient>
    <linearGradient id="whatsapp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25d366"/>
      <stop offset="1" stop-color="#078b48"/>
    </linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10a391"/>
      <stop offset="1" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#269dea"/>
      <stop offset="1" stop-color="#0067b9"/>
    </linearGradient>
    <linearGradient id="local" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#916ee0"/>
      <stop offset="1" stop-color="#5834ad"/>
    </linearGradient>
    <linearGradient id="delivery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e48f32"/>
      <stop offset="1" stop-color="#bd5b13"/>
    </linearGradient>
    <linearGradient id="handoff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef715a"/>
      <stop offset="1" stop-color="#be3e35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#123c50" flood-opacity=".20"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4 0 8z" fill="#17627a"/>
    </marker>
    <style>
      .node { filter: url(#shadow); stroke: #123d4d; stroke-width: 2.5; }
      .title { font: 800 19px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .detail { font: 600 13.5px "Segoe UI", Arial, sans-serif; fill: #effffb; }
      .band-title { font: 800 17px "Segoe UI", Arial, sans-serif; fill: #174b5d; letter-spacing: .04em; }
      .edge { fill: none; stroke: #17627a; stroke-width: 2.35; marker-end: url(#arrow); }
      .return-edge { fill: none; stroke: #17627a; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .edge-label { font: 800 13px "Segoe UI", Arial, sans-serif; fill: #174b5d; }
      .label-bg { fill: #fff; stroke: #7fb9c6; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="10" y="10" width="1380" height="1480" rx="30" fill="url(#background)" stroke="#63bdc8" stroke-width="3"/>

  <text x="48" y="55" class="band-title">USER AND META CHANNEL</text>
  <rect x="35" y="72" width="1330" height="230" rx="22" fill="#e9fff2" stroke="#71c993" stroke-width="2"/>

  <rect class="node" x="160" y="112" width="360" height="94" rx="18" fill="url(#whatsapp)"/>
  <text x="340" y="145" text-anchor="middle" class="title">WhatsApp user</text>
  <text x="340" y="171" text-anchor="middle" class="detail">Text, voice note, topic or preference selection</text>

  <path class="edge" d="M520 159H685"/>
  <path class="return-edge" d="M685 188H520"/>

  <rect class="node" x="690" y="112" width="530" height="94" rx="18" fill="url(#whatsapp)"/>
  <text x="955" y="145" text-anchor="middle" class="title">Meta WhatsApp Cloud API</text>
  <text x="955" y="171" text-anchor="middle" class="detail">Signed webhooks, media, text, audio, buttons and lists</text>

  <text x="48" y="345" class="band-title">SAGE APPLICATION - AZURE CONTAINER APPS</text>
  <rect x="35" y="362" width="1330" height="785" rx="22" fill="#f7fcff" stroke="#75acc3" stroke-width="2"/>

  <path class="edge" d="M955 206V395"/>
  <rect class="label-bg" x="975" y="267" width="142" height="28" rx="8"/>
  <text x="1046" y="287" text-anchor="middle" class="edge-label">Signed webhook</text>

  <rect class="node" x="485" y="400" width="430" height="80" rx="18" fill="url(#service)"/>
  <text x="700" y="432" text-anchor="middle" class="title">Webhook and sender-serialization layer</text>
  <text x="700" y="458" text-anchor="middle" class="detail">Signature checks, deduplication, read receipts and per-sender ordering</text>

  <path class="edge" d="M700 480V522"/>

  <rect class="node" x="435" y="527" width="530" height="88" rx="18" fill="url(#service)"/>
  <text x="700" y="560" text-anchor="middle" class="title">Policy, conversation and preference router</text>
  <text x="700" y="586" text-anchor="middle" class="detail">Critical controls, safety, topics, preferences and handoff state</text>

  <rect class="node" x="1025" y="515" width="275" height="106" rx="18" fill="url(#local)"/>
  <text x="1162" y="549" text-anchor="middle" class="title">SQLite</text>
  <text x="1162" y="575" text-anchor="middle" class="detail">Conversations and preferences</text>
  <text x="1162" y="597" text-anchor="middle" class="detail">Delivery plans and audit events</text>
  <path class="edge" d="M965 570H1025"/>
  <path class="return-edge" d="M1025 596H965"/>

  <path class="edge" d="M560 615V650H265V690"/>
  <rect class="label-bg" x="355" y="634" width="92" height="28" rx="8"/>
  <text x="401" y="654" text-anchor="middle" class="edge-label">Voice input</text>

  <rect class="node" x="80" y="695" width="370" height="94" rx="18" fill="url(#azure)"/>
  <text x="265" y="727" text-anchor="middle" class="title">Azure Speech transcription</text>
  <text x="265" y="753" text-anchor="middle" class="detail">FFmpeg conversion + en-US / sw-KE</text>
  <text x="265" y="775" text-anchor="middle" class="detail">Fast transcription API</text>

  <path class="edge" d="M700 615V690"/>
  <rect class="label-bg" x="718" y="634" width="86" height="28" rx="8"/>
  <text x="761" y="654" text-anchor="middle" class="edge-label">Text input</text>

  <rect class="node" x="535" y="695" width="330" height="94" rx="18" fill="url(#service)"/>
  <text x="700" y="727" text-anchor="middle" class="title">Prompt builder</text>
  <text x="700" y="753" text-anchor="middle" class="detail">Question, recent history</text>
  <text x="700" y="775" text-anchor="middle" class="detail">and complete SAL manual</text>

  <path class="edge" d="M450 742H535"/>

  <rect class="node" x="1015" y="690" width="295" height="94" rx="18" fill="url(#local)"/>
  <text x="1162" y="723" text-anchor="middle" class="title">SAL manual JSONL</text>
  <text x="1162" y="749" text-anchor="middle" class="detail">58 validated chunks</text>
  <text x="1162" y="771" text-anchor="middle" class="detail">Chapter and page metadata</text>
  <path class="edge" d="M1015 741H865"/>

  <path class="edge" d="M700 789V831"/>
  <rect class="node" x="535" y="836" width="330" height="86" rx="18" fill="url(#azure)"/>
  <text x="700" y="870" text-anchor="middle" class="title">GPT-5.6 Luna</text>
  <text x="700" y="896" text-anchor="middle" class="detail">Intent + localized grounded or social response</text>

  <path class="edge" d="M700 922V962"/>
  <rect class="node" x="480" y="967" width="440" height="86" rx="18" fill="url(#service)"/>
  <text x="700" y="1001" text-anchor="middle" class="title">Intent, citation and reply-mode validator</text>
  <text x="700" y="1027" text-anchor="middle" class="detail">Schema, citations, policy, language and output format</text>

  <path class="edge" d="M565 1053V1125H285V1230"/>
  <rect class="label-bg" x="378" y="1069" width="122" height="28" rx="8"/>
  <text x="439" y="1089" text-anchor="middle" class="edge-label">Voice / Both</text>

  <path class="edge" d="M835 1053V1140H735V1230"/>
  <rect class="label-bg" x="854" y="1077" width="120" height="28" rx="8"/>
  <text x="914" y="1097" text-anchor="middle" class="edge-label">Text / Sources</text>

  <text x="48" y="1190" class="band-title">OUTBOUND DELIVERY AND HUMAN SUPPORT</text>
  <rect x="35" y="1207" width="1330" height="245" rx="22" fill="#fff9eb" stroke="#e7a94b" stroke-width="2"/>

  <rect class="node" x="80" y="1235" width="410" height="92" rx="18" fill="url(#azure)"/>
  <text x="285" y="1268" text-anchor="middle" class="title">Azure neural text-to-speech</text>
  <text x="285" y="1294" text-anchor="middle" class="detail">en-KE-AsiliaNeural / sw-KE-ZuriNeural</text>
  <text x="285" y="1316" text-anchor="middle" class="detail">OGG / Opus voice-note audio</text>

  <path class="edge" d="M490 1281H555"/>
  <rect class="node" x="560" y="1235" width="350" height="92" rx="18" fill="url(#delivery)"/>
  <text x="735" y="1268" text-anchor="middle" class="title">Persisted delivery executor</text>
  <text x="735" y="1294" text-anchor="middle" class="detail">Audio, text, buttons and lists</text>
  <text x="735" y="1316" text-anchor="middle" class="detail">Resume from first incomplete step</text>

  <path class="edge" d="M910 1281H1030"/>
  <rect class="node" x="1035" y="1235" width="285" height="92" rx="18" fill="url(#whatsapp)"/>
  <text x="1177" y="1268" text-anchor="middle" class="title">Meta delivery</text>
  <text x="1177" y="1294" text-anchor="middle" class="detail">Media upload and send</text>
  <text x="1177" y="1316" text-anchor="middle" class="detail">Interactive preference list</text>

  <path class="return-edge" d="M1177 1235V1100H1340V160H1220"/>

  <path class="edge" d="M920 1010H1250V1345"/>
  <rect class="label-bg" x="1050" y="988" width="132" height="28" rx="8"/>
  <text x="1116" y="1008" text-anchor="middle" class="edge-label">Human handoff</text>

  <rect class="node" x="955" y="1350" width="365" height="72" rx="18" fill="url(#handoff)"/>
  <text x="1137" y="1379" text-anchor="middle" class="title">Pause bot and notify staff</text>
  <text x="1137" y="1403" text-anchor="middle" class="detail">Coexistence or staff inbox is future work</text>
</svg>
